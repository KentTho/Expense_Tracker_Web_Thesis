name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker-be
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # CANONICAL runtime = 3.12 (đã verify clean-build python:3.12-slim +
          # full pytest + pip check qua Docker — xem docs/architecture).
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Alembic rebuild-from-zero
        run: python -m alembic upgrade head
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: expense-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test -- --run
      - name: Build
        # Gate 04A1 fail-closed: production build BẮT BUỘC VITE_API_URL hợp lệ.
        # Origin placeholder non-secret (KHÔNG phải host Render thật) chỉ để verify build.
        env:
          VITE_API_URL: https://backend.example.com
        run: npm run build

  docker:
    name: Docker (backend image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t expense-tracker-be:ci ./expense-tracker-be
