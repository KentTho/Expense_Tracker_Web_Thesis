name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker-be
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Alembic rebuild-from-zero
        run: python -m alembic upgrade head
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: expense-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test -- --run
      - name: Build
        run: npm run build
